name: verify

# 触发策略：
#  - push 到主分支：全量验证 + 三平台打包（打包很慢，只在主分支做）
#  - PR：只做验证，不打包（反馈快）
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 同一分支的重复推送取消上一次未完成的运行，避免排队堆积
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 验证（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # 只验证 macOS：本项目只分发 macOS，另两个平台既不出包也不支持。
      # 之前跑三平台时两个非目标平台稳定失败（Windows 的 jsdom 环境差异、
      # Linux 无显示服务起不了 Electron），红的原因与交付物无关——
      # 这会把 CI 训练成"看到红也忽略"，比没有 CI 更糟。
      # 将来真要支持其它平台，把对应 os 加回来并修好该平台的失败。
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        # Electron 与 electron-builder 的二进制较大，用 npm ci 保证可复现
        run: npm ci

      - name: 下载 Electron 二进制
        shell: bash
        run: |
          # 官方 postinstall 从 GitHub Releases 拉取，CI 上偶发失败。
          # 失败时用脚本重试（脚本同时做 SHA256 校验）。
          if [ ! -x "node_modules/electron/dist/Electron.app/Contents/MacOS/Electron" ] \
             && [ ! -f "node_modules/electron/dist/electron" ] \
             && [ ! -f "node_modules/electron/dist/electron.exe" ]; then
            ./scripts/fetch-electron-binary.sh || echo "::warning::Electron 二进制可能未就位"
          fi

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 数据安全静态验证
        run: npm run verify:l0

      - name: 输入规则复现（jsdom）
        run: npm run test:input-rules

      - name: 应用启动自检
        # macOS runner 自带可用显示环境，直接跑真实 Electron
        run: npm run smoke

      - name: 上传自检日志
        # 失败时才需要日志，成功时上传只会浪费存储
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.os }}
          path: |
            /tmp/verify-all.log
            /tmp/smoke*.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: 打包（${{ matrix.os }}）
    # 只在主分支与版本标签上打包：打包耗时长，PR 阶段没有必要
    if: github.event_name == 'push'
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            artifact: mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 打包
        env:
          # 签名凭据从仓库 Secrets 注入。
          # 未配置时 electron-builder 会产出未签名包并给出警告，
          # 而不是失败——这样 fork 与本地环境仍能跑通打包流程。
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: typeflow-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
          retention-days: 14
